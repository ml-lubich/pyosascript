[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyosascript"
version = "0.1.0"
description = "Type-safe, robust Python bindings and CLI for macOS AppleScript and JXA (JavaScript for Automation)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ml-lubich" }]
keywords = ["osascript", "applescript", "jxa", "macos", "automation", "python-bridge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/pyosascript"
Repository = "https://github.com/ml-lubich/pyosascript"
Issues = "https://github.com/ml-lubich/pyosascript/issues"

[project.scripts]
osascript-py = "pyosascript.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyosascript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=pyosascript --cov-report=term-missing"
